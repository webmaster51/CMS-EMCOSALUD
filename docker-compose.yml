# Entorno local — CMS EMCO SALUD.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms']
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor de correo de desarrollo (UI en http://localhost:8025).
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://cms:cms@postgres:5432/cms
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - '4321:4321'
    # Aplica migraciones y arranca.
    command: sh -c "node scripts/migrate.mjs && node ./dist/server/entry.mjs"