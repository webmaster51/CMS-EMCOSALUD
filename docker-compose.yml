version: '3.8'

services:
  # 1. Base de Datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_password_seguro}
      POSTGRES_DB: ${POSTGRES_DB:-cms_emcosalud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cms}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cms-network

  # 2. Almacenamiento MinIO
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin_password_seguro}
    volumes:
      - miniodata:/data
    networks:
      - cms-network

  # Crea el bucket al arrancar
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin_password_seguro}; do sleep 2; done;
      mc mb -p local/cms-media || true;
      mc anonymous set download local/cms-media || true;
      "
    networks:
      - cms-network

  # 3. Nginx Proxy Manager (Gestor de Dominios y SSL)
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - cms-network

  # 4. Aplicación CMS en Astro SSR
  app:
    build: .
    container_name: cms-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD:-cms_password_seguro}@postgres:5432/${POSTGRES_DB:-cms_emcosalud}
      STORAGE_ENDPOINT: http://minio:9000
    # Corre las migraciones y luego levanta Astro SSR
    command: sh -c "node scripts/migrate.mjs && node ./dist/server/entry.mjs"
    networks:
      - cms-network

volumes:
  pgdata:
  miniodata:

networks:
  cms-network:
    driver: bridge